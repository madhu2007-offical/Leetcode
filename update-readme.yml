name: 🔄 Daily LeetCode Stats Sync

on:
  schedule:
    # Runs every day at 00:30 UTC (~6:00 AM IST)
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch LeetCode stats & update README
        run: python scripts/update_leetcode_stats.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "leetcode-stats-bot"
          git config --global user.email "actions@github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Auto-update LeetCode stats [skip ci]"
          git push
